plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.gms.google.services)
}

android {
    namespace 'com.example.time4meds'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.time4meds"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    // Core Android libraries
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Firebase
    implementation 'com.google.firebase:firebase-auth:23.0.0'
    implementation 'com.google.firebase:firebase-database:20.2.1'
    implementation 'com.google.firebase:firebase-storage:20.3.0'

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core

    // Location - Welcomepage
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // Glide - to load image (ElderlyAdapter)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Image shape
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // WorkManager for scheduling notifications
    implementation "androidx.work:work-runtime:2.8.1"

    // Notification compilation
    implementation "androidx.core:core:1.10.1"

    // For HTTP requests
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'

    // For JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Logo rounded
    implementation 'com.google.android.material:material:1.10.0'

    // Lottie splash
    implementation "com.airbnb.android:lottie:6.7.0"

    // Tutorial Page
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Pinch Zoom
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

}
